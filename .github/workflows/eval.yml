name: live evaluation
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to run the 20 cases against
        type: choice
        options: [groq, mistral, gemini, anthropic]
        default: groq
      judge:
        description: Also run the DeepEval faithfulness score
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the cases
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evalbot.run --provider "${{ inputs.provider }}"
      - name: Show the report on the run page
        if: always()
        run: cat reports/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Faithfulness score (optional)
        if: ${{ inputs.judge }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evalbot.judge --provider "${{ inputs.provider }}"
      - name: Save the report in the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Add evaluation report (${{ inputs.provider }})" || exit 0
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/
